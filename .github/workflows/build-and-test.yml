name: Build and Test

# This file defines a workflow parameterized by ref, OS and GHC version,
# that is called from the top-level CI workflow.
# Where Linux and macOS differ, the steps test RUNNER_OS.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      ghc_version:
        required: true
        type: string
      hls_version:
        required: true
        type: string
      test_parallel:
        required: false
        default: true
        type: boolean
      timeout_override:
        required: false
        default: false
        type: boolean
      brew_update:
        required: false
        default: true
        type: boolean
      ref:
        description: "Branch, tag or SHA to test (empty for the commit that triggered the caller)"
        required: false
        default: ''
        type: string
      test_suite:
        required: false
        default: true
        type: boolean
      test_toooba:
        required: false
        default: true
        type: boolean
      test_contrib:
        required: false
        default: true
        type: boolean
      test_bdw:
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: "Build: ${{ inputs.os }} ghc-${{ inputs.ghc_version }}"
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_override && 360 || (startsWith(inputs.os, 'macos') && 45 || 30) }}
    # The test jobs check out the commit built here, even if ref is a
    # branch that moves while the workflow runs
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Install dependencies
        shell: bash
        env:
          BREW_UPDATE: ${{ inputs.brew_update }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
              .github/workflows/install_dependencies_macos.sh
            else
              sudo .github/workflows/install_dependencies_ubuntu.sh
            fi
      # Don't rely on the VM to pick the GHC version
      # (and don't assume that GHCup is already installed on the runner)
      - name: Install GHC
        uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ inputs.ghc_version }}
          cabal: recommended
      # Until BSC uses cabal to build, pre-install these packages
      - name: Install Haskell dependencies
        shell: bash
        run: |
          cabal update
          cabal v1-install old-time regex-compat split strict-concurrency syb
      # Restore previous ccache cache of compiled object files. Use a SHA
      # in the key so that a new cache file is generated after every build,
      # and have the restore-key use the most recent.
      - name: CCache cache files
        uses: actions/cache@v5
        with:
          path: ${{ GITHUB.WORKSPACE }}/ccache
          key: build-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-${{ steps.checkout.outputs.commit }}
          restore-keys: |
            build-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-
      - name: Build
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: |
          ccache --zero-stats --max-size 250M
          if [ "$RUNNER_OS" = "macOS" ]; then
              export PATH=$(brew --prefix)/opt/ccache/libexec:$PATH

              # Hack: Remove incompatible TCL header that something has installed
              # in /usr/local/include in the GitHub CI image. This dir is at the
              # start of the compiler's default search path, and overrides the
              # system tcl.h, and causes a linker failure (because of a macro that
              # renames Tcl_Main to Tcl_MainEx). We want to build against the
              # system TCL so we don't introduce any extra deps for the bluetcl
              # binary.
              rm -f /usr/local/include/tcl.h

              CORES=$(sysctl -n hw.ncpu)
              GHC_MAX_HEAP=4500M
            else
              export PATH=/usr/lib/ccache:$PATH

              CORES=$(nproc)
              GHC_MAX_HEAP=5G
            fi
          echo "Cores: ${CORES}"

          # Generate package info
          export BSC_BUILD_PKGINFO=1

          # An STP test hangs on the ARM runners
          if [[ "${{ inputs.os }}" == *-arm ]]; then
              export STP_STUB=1
            fi

          make -j ${CORES} GHCJOBS=2 GHCRTSFLAGS="+RTS -M${GHC_MAX_HEAP} -A128m -RTS" install-src
          tar czf inst.tar.gz inst
      - name: CCache stats
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: ccache --show-stats
      - name: Smoketest
        run: "make check-smoke"
      # if this step fails, it may mean you need to update
      # util/haskell-language-server/gen_hie.py to
      # reflect the locations of any new haskell sources
      - name: Test Haskell Language Server
        if: ${{ inputs.hls_version != '' }}
        run: |
          ghcup install hls ${{ inputs.hls_version }}
          if [ "$RUNNER_OS" = "macOS" ]; then
              macos_ver=$(sw_vers -productVersion | cut -d '.' -f 1)
              if [ "$macos_ver" -ge "14" ]; then
                  python3 -m venv ./venv
                  source ./venv/bin/activate
                  python3 -m pip install pyyaml
                else
                  pip3 install pyyaml
                fi
            else
              ubuntu_ver=$(lsb_release -rs | cut -d '.' -f 1)
              if [ "$ubuntu_ver" -ge "24" ]; then
                  sudo apt-get update
                  sudo apt-get install -y python3-yaml
                else
                  pip3 install pyyaml
                fi
            fi
          python3 util/haskell-language-server/gen_hie.py
          pushd src/comp
          haskell-language-server-${{ inputs.ghc_version }} bsc.hs
          popd
      # Check that .ghci has all the right flags to load the source.
      # This is important for text editor integration & tools like ghcid
      # NB stp, yices and htcl must be built first, so do this after Build.
      - name: Check GHCI :load
        run: |
          cd src/comp
          export NOGIT=0
          export NOUPDATEBUILDVERSION=0
          ./update-build-version.sh
          ./update-build-system.sh
          echo ':load bsc.hs' | ghci 2>&1 | tee ghci.log
          if grep '\(Failed\|error:\)' ghci.log
          then
            echo "GHCi reported errors."
            exit 1
          else
            echo "GHCi loaded successfully."
            exit 0
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.os }} ghc-${{ inputs.ghc_version }} build
          path: inst.tar.gz

  test:
    name: "Test ${{ inputs.os }} ghc-${{ inputs.ghc_version }}"
    if: inputs.test_suite
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_override && 360 || (startsWith(inputs.os, 'macos') && 240 || 120) }}
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Install dependencies
        shell: bash
        env:
          BREW_UPDATE: ${{ inputs.brew_update }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
              .github/workflows/install_dependencies_testsuite_macos.sh
            else
              sudo .github/workflows/install_dependencies_testsuite_ubuntu.sh
            fi

      - name: Download bsc
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.os }} ghc-${{ inputs.ghc_version }} build
      - name: Install bsc
        run: "tar xzf inst.tar.gz"

      # Restore previous ccache cache of compiled object files. Use a SHA
      # in the key so that a new cache file is generated after every
      # successful build, and have the restore-key use the most recent.
      - name: CCache cache files
        uses: actions/cache@v5
        with:
          path: ${{ GITHUB.WORKSPACE }}/ccache
          key: test-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-${{ needs.build.outputs.sha }}
          restore-keys: |
            test-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-

      - name: Run testsuite
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: |
          # Use ccache to avoid recompiling generated .cxx every run.
          ccache --zero-stats --max-size 500M
          if [ "$RUNNER_OS" = "macOS" ]; then
              export PATH=$(brew --prefix)/opt/ccache/libexec:$PATH
              CORES=$(sysctl -n hw.ncpu)
            else
              export PATH=/usr/lib/ccache:$PATH
              CORES=$(nproc)

              # Use the LLVM linker as the C++ linker
              # for a moderate build-time speedup over ld.bfd
              export LINKER=lld
              export LDFLAGS="-Wl,-fuse-ld=$LINKER"
            fi

          # Use -O0 for significantly faster C++ compiles (which more
          # than make up for slower simulations)
          export CXXFLAGS="-O0"

          # Always archive logs, even if make fails (and terminates this script
          # because it's invoked with :set -eo pipefile)
          trap ./testsuite/archive_logs.sh EXIT

          if [[ "${{ inputs.test_parallel }}" == "true" ]]; then
              echo "Cores: ${CORES}"
              MK_JFLAG="-j ${CORES}"
              MK_TARGET=checkparallel
            else
              MK_JFLAG=
              MK_TARGET=check
            fi

          if [ "$RUNNER_OS" = "macOS" ]; then
              # Identify the C++ standard for linking with the SystemC library
              SYSTEMC_CXXSTD=`nm --demangle $(brew --prefix systemc)/lib/libsystemc.dylib | grep sc_api_version_ | sed -E 's/.*_cxx20([0-9][0-9]).*/\1/' | head -1`

              make ${MK_JFLAG} -C testsuite ${MK_TARGET} \
                   TEST_SYSTEMC_INC=$(brew --prefix systemc)/include \
                   TEST_SYSTEMC_LIB=$(brew --prefix systemc)/lib \
                   TEST_SYSTEMC_CXXFLAGS=-std=c++${SYSTEMC_CXXSTD}
            else
              make ${MK_JFLAG} -C testsuite ${MK_TARGET}
            fi

      # Show ccache stats so we can see what the hit-rate is like.
      - name: CCache stats
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: ccache --show-stats

      # Save test logs on failure so we can diagnose
      - name: Archive test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}
          path: logs.tar.gz

  test-toooba:
    name: "Test Toooba ${{ inputs.os }} ghc-${{ inputs.ghc_version }}"
    if: inputs.test_toooba
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_override && 360 || (startsWith(inputs.os, 'macos') && 60 || 30) }}
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
              if [ "${{ inputs.brew_update }}" != "false" ]; then
                  brew update
                fi
              brew install ccache libelf
            else
              sudo apt-get update
              sudo apt-get install -y ccache libelf-dev
            fi

      - name: Download bsc
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.os }} ghc-${{ inputs.ghc_version }} build
      - name: Install bsc
        run: "tar xzf inst.tar.gz"

      - name: Download Toooba
        env:
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          COMPANION_BRANCH: ${{ inputs.ref }}
        run: .github/workflows/checkout_possible_branch.sh bluespec Toooba

      # Restore previous ccache cache of compiled object files. Use a SHA
      # in the key so that a new cache file is generated after every
      # successful build, and have the restore-key use the most recent.
      - name: CCache cache files
        uses: actions/cache@v5
        with:
          path: ${{ GITHUB.WORKSPACE }}/ccache
          key: test-toooba-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-${{ needs.build.outputs.sha }}
          restore-keys: |
            test-toooba-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-

      - name: Compile and link Toooba
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: |
          # Use ccache to avoid recompiling generated .cxx every run.
          ccache --zero-stats --max-size 500M
          if [ "$RUNNER_OS" = "macOS" ]; then
              export PATH=$(brew --prefix)/opt/ccache/libexec:$PATH
              CORES=$(sysctl -n hw.ncpu)
            else
              export PATH=/usr/lib/ccache:$PATH
              CORES=$(nproc)
            fi

          export PATH=$PWD/../bsc/inst/bin:$PATH

          cd ../Toooba/builds/RV64ACDFIMSU_Toooba_bluesim/

          # Use -O0 for significantly faster C++ compiles (which more
          # than make up for slower simulations)
          export CXXFLAGS="-O0"

          echo "Cores: ${CORES}"

          # Workaround hardcoded parallelism
          sed -i -e "s/-parallel-sim-link 8/-parallel-sim-link ${CORES}/" ../Resources/Include_bluesim.mk

          # For ccache to be effective, the output needs to be reproducible
          make BSC_C_FLAGS="-no-show-version -no-show-timestamps" all

      - name: Test Toooba
        run: |
          export PATH=$PWD/../bsc/inst/bin:$PATH

          if [ "$RUNNER_OS" = "macOS" ]; then
              # Workaround limitation in the Makefile for Homebrew on older macOS
              export CPATH=/usr/local/include/libelf
            fi

          cd ../Toooba/builds/RV64ACDFIMSU_Toooba_bluesim/

          # Workaround bugs in the regression script
          #make isa_tests | tee isa_tests.log
          #grep -q 'FAIL:        0 tests' isa_tests.log
          make test | tee test.log
          grep -q 'PASS' test.log

      # Show ccache stats so we can see what the hit-rate is like.
      - name: CCache stats
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: ccache --show-stats

  test-contrib:
    name: "Test bsc-contrib ${{ inputs.os }} ghc-${{ inputs.ghc_version }}"
    if: inputs.test_contrib
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_override && 360 || 30 }}
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Install dependencies
        shell: bash
        env:
          BREW_UPDATE: ${{ inputs.brew_update }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
              .github/workflows/install_dependencies_testsuite_macos.sh
            else
              sudo .github/workflows/install_dependencies_testsuite_ubuntu.sh
            fi

      - name: Download bsc
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.os }} ghc-${{ inputs.ghc_version }} build
      - name: Install bsc
        run: "tar xzf inst.tar.gz"

      - name: Download bsc-contrib
        env:
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          COMPANION_BRANCH: ${{ inputs.ref }}
        run: .github/workflows/checkout_possible_branch.sh B-Lang-org bsc-contrib

      - name: Build and install bsc-contrib
        run: |
          export PATH=$PWD/../bsc/inst/bin:$PATH
          make -C ../bsc-contrib/

      # Restore previous ccache cache of compiled object files. Use a SHA
      # in the key so that a new cache file is generated after every
      # successful build, and have the restore-key use the most recent.
      - name: CCache cache files
        uses: actions/cache@v5
        with:
          path: ${{ GITHUB.WORKSPACE }}/ccache
          key: test-contrib-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-${{ needs.build.outputs.sha }}
          restore-keys: |
            test-contrib-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-

      - name: Run bsc-contrib tests
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: |
          # Use ccache to avoid recompiling generated .cxx every run.
          ccache --zero-stats --max-size 500M
          if [ "$RUNNER_OS" = "macOS" ]; then
              export PATH=$(brew --prefix)/opt/ccache/libexec:$PATH
            else
              export PATH=/usr/lib/ccache:$PATH

              # Use the LLVM linker as the C++ linker
              # for a moderate build-time speedup over ld.bfd
              export LINKER=lld
              export LDFLAGS="-Wl,-fuse-ld=$LINKER"
            fi

          # Use -O0 for significantly faster C++ compiles (which more
          # than make up for slower simulations)
          export CXXFLAGS="-O0"

          # Copy the bsc-contrib tests into place
          cp -r ../bsc-contrib/testing/bsc.contrib testsuite/

          # Inform the tests of the path to the bsc-contrib libraries
          export BSCCONTRIBDIR=$PWD/../bsc-contrib/inst

          # Always archive logs, even if make fails (and terminates this script
          # because it's invoked with :set -eo pipefile)
          trap ./testsuite/archive_logs.sh EXIT

          make -C testsuite/bsc.contrib check

      # Show ccache stats so we can see what the hit-rate is like.
      - name: CCache stats
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: ccache --show-stats

      # Save test logs on failure so we can diagnose
      - name: Archive test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-contrib-logs-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}
          path: logs.tar.gz

  test-bdw:
    name: "Test bdw ${{ inputs.os }} ghc-${{ inputs.ghc_version }}"
    if: inputs.test_bdw
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_override && 360 || 30 }}
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download bsc
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.os }} ghc-${{ inputs.ghc_version }} build
      - name: Install bsc
        run: "tar xzf inst.tar.gz"

      - name: Download bdw
        env:
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          COMPANION_BRANCH: ${{ inputs.ref }}
        run: .github/workflows/checkout_possible_branch.sh B-Lang-org bdw

      - name: Build and install bdw
        run: |
          export PATH=$PWD/../bsc/inst/bin:$PATH
          make -C ../bdw/

      - name: Install dependencies
        shell: bash
        env:
          BREW_UPDATE: ${{ inputs.brew_update }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
              ../bdw/.github/workflows/install_dependencies_testsuite_macos.sh
            else
              sudo ../bdw/.github/workflows/install_dependencies_testsuite_ubuntu.sh
            fi

      # Restore previous ccache cache of compiled object files. Use a SHA
      # in the key so that a new cache file is generated after every
      # successful build, and have the restore-key use the most recent.
      - name: CCache cache files
        uses: actions/cache@v5
        with:
          path: ${{ GITHUB.WORKSPACE }}/ccache
          key: test-bdw-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-${{ needs.build.outputs.sha }}
          restore-keys: |
            test-bdw-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}-ccache-

      - name: Run bdw tests
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: |
          # Use ccache to avoid recompiling generated .cxx every run.
          ccache --zero-stats --max-size 500M
          if [ "$RUNNER_OS" = "macOS" ]; then
              export PATH=$(brew --prefix)/opt/ccache/libexec:$PATH
            else
              export PATH=/usr/lib/ccache:$PATH

              # Use the LLVM linker as the C++ linker
              # for a moderate build-time speedup over ld.bfd
              export LINKER=lld
              export LDFLAGS="-Wl,-fuse-ld=$LINKER"
            fi

          # Use -O0 for significantly faster C++ compiles (which more
          # than make up for slower simulations)
          export CXXFLAGS="-O0"

          # Copy the bdw tests into place
          cp -r ../bdw/testing/bsc.bdw testsuite/

          # Inform the tests of the path to bdw
          export BDW=$PWD/../bdw/inst/bin/bdw

          # Always archive logs, even if make fails (and terminates this script
          # because it's invoked with :set -eo pipefile)
          trap ./testsuite/archive_logs.sh EXIT

          if [ "$RUNNER_OS" = "macOS" ]; then
              make -C testsuite/bsc.bdw check
            else
              xvfb-run -a make -C testsuite/bsc.bdw check
            fi

      # Show ccache stats so we can see what the hit-rate is like.
      - name: CCache stats
        env:
          CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/ccache
        run: ccache --show-stats

      # Save test logs on failure so we can diagnose
      - name: Archive test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-bdw-logs-${{ inputs.os }}-ghc-${{ inputs.ghc_version }}
          path: logs.tar.gz

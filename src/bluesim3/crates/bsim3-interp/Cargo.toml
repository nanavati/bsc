[package]
name = "bsim3-interp"
description = "Reference interpreter over BIR: the differential oracle (DESIGN.md P1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bsim3-ir = { path = "../bsim3-ir" }
bsim3-codegen = { path = "../bsim3-codegen", optional = true }
libloading = "0.8"
libc = "0.2"

[build-dependencies]
# vendored libfst (FST wave sink; see build.rs)
cc = "1"

[features]
# hybrid JIT: eligible rules run as LLVM-compiled functions inside the
# interpreter's event loop (BSIM3_JIT=1 at runtime; needs llvm-18-dev)
jit = ["dep:bsim3-codegen", "bsim3-codegen/llvm"]
